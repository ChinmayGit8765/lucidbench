[package]
name = "lucidbench-desktop"
version = "0.2.0"
description = "Lucidbench desktop shell"
edition = "2021"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
