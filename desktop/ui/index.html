<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lucidbench</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { height: 100%; margin: 0; background: #0b0d12; color: #e6e8ee;
    font-family: "Segoe UI", system-ui, sans-serif; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; }
  svg { width: 96px; height: 96px; }
  h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: .02em; }
  #status { min-height: 1.4em; font-size: 14px; color: #9aa1b2; max-width: 520px;
    text-align: center; white-space: pre-wrap; }
  #status.error { color: #ff8a8a; }
  button { display: none; padding: 8px 22px; font-size: 14px; color: #fff; cursor: pointer;
    background: #4f6ff0; border: 0; border-radius: 6px; }
  button:hover { background: #6180ff; }
</style>
</head>
<body>
<main>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
    <defs>
      <linearGradient id="f" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#3fb6e8"/>
        <stop offset="0.55" stop-color="#4f6ff0"/>
        <stop offset="1" stop-color="#7d4fe0"/>
      </linearGradient>
    </defs>
    <rect width="32" height="32" rx="8" fill="url(#f)"/>
    <path d="M8 8.5v15h16" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="18.5" cy="14" r="5" fill="#fff" fill-opacity="0.22" stroke="#fff" stroke-width="2.4"/>
  </svg>
  <h1>Lucidbench</h1>
  <div id="status">Starting...</div>
  <button id="retry" type="button">Retry</button>
</main>
<script>
  const statusEl = document.getElementById("status");
  const retry = document.getElementById("retry");
  const tauri = window.__TAURI__;

  async function boot() {
    retry.style.display = "none";
    statusEl.className = "";
    statusEl.textContent = "Looking for the Lucidbench daemon...";
    if (!tauri) {
      statusEl.className = "error";
      statusEl.textContent = "This page must be opened inside the Lucidbench app.";
      return;
    }
    try {
      await tauri.core.invoke("boot"); // navigates the window on success
    } catch (e) {
      statusEl.className = "error";
      statusEl.textContent = String(e);
      retry.style.display = "inline-block";
    }
  }

  if (tauri) {
    tauri.event.listen("boot-status", (e) => { statusEl.textContent = e.payload; });
  }
  retry.addEventListener("click", boot);
  boot();
</script>
</body>
</html>
