id: web-app
name: Web app or SaaS (product)
blurb: A product people use in the browser, with accounts, data or subscriptions behind it.
order: 2
types: [web-app]
questions:
  - id: users
    text: Who uses it today?
    type: choice
    options: [nobody-yet, me-and-friends, paying-customers]
  - id: accounts
    text: Do people sign in?
    type: bool
  - id: payments
    text: Does it take payments?
    type: bool
  - id: data
    text: Does it store personal data?
    type: bool
  - id: tests
    text: What automated tests exist?
    type: choice
    options: [none, some, thorough]
  - id: deploy
    text: How does it get deployed?
    type: choice
    options: [by-hand, ci-pipeline, not-deployed]
  - id: stack
    text: What is it built with?
    type: text
  - id: tenancy
    text: Do different customers' data live in the same database?
    type: choice
    options: [one-user-or-team, many-customers-shared, many-customers-separate]
    optional: true
  - id: monitoring
    text: How would you find out it broke in production?
    type: choice
    options: [a-user-tells-me, logs-i-check, alerts-and-error-tracking]
    optional: true
rules:
  - commands: [npm test]
    criteria:
      - "The build and the tests pass from a clean checkout — proof: the build and npm test output"
  - when: {tests: none}
    criteria:
      - "The main user journey has an automated test — proof: the test name and a passing run"
    risk:
      level: medium
      reason: No automated tests, so a change can break things unnoticed
  - when: {accounts: "true"}
    criteria:
      - "Signing up, signing in and signing out work, and a signed-out visitor cannot see signed-in pages — proof: a test or a recorded run"
    risk:
      level: medium
      reason: Sign-in is a security boundary
  - when: {payments: "true"}
    criteria:
      - "A test-mode payment succeeds, fails and is refunded correctly — proof: the provider's test-mode dashboard and the app's records"
    risk:
      level: high
      reason: Money is involved, and mistakes cost real people
  - when: {data: "true"}
    criteria:
      - "Personal data can be exported and deleted — proof: a run of both with a test account"
    risk:
      level: high
      reason: Personal data brings privacy duties and leak risk
  - when: {users: paying-customers}
    criteria:
      - "A release can be rolled back — proof: a rollback rehearsed on a staging copy"
    risk:
      level: high
      reason: Paying customers notice every outage
  - when: {tenancy: many-customers-shared}
    criteria:
      - "One customer can never read or change another customer's records — proof: a test that signs in as customer A and requests customer B's records by id"
    risk:
      level: high
      reason: A missing tenant check leaks one customer's data to another
  - when: {monitoring: [a-user-tells-me, logs-i-check]}
    criteria:
      - "An error in production reaches you without anyone reporting it — proof: a deliberate test error arriving in the error tracker or alert channel"
    risk:
      level: medium
      reason: Without alerts, outages are found by users first
  - when: {deploy: by-hand}
    risk:
      level: medium
      reason: A hand deploy is easy to get wrong and hard to repeat
