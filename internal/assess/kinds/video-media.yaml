id: video-media
name: Video system
blurb: A pipeline, streaming service or editing tool that makes, edits, streams or publishes video, audio or images.
order: 8
types: [video-system]
questions:
  - id: role
    text: What does it do with media?
    type: choice
    options: [render-or-edit, encode-or-convert, stream-or-play, publish]
  - id: input
    text: Where does the source material come from?
    type: choice
    options: [my-own, licensed, user-uploads]
  - id: size
    text: How big is a typical job?
    type: choice
    options: [seconds-of-clip, minutes, hours-or-gigabytes]
  - id: pipeline
    text: Does it run unattended in a pipeline?
    type: bool
  - id: output
    text: What must the output be?
    type: text
  - id: latency
    text: How soon after the input arrives must the output be ready?
    type: choice
    options: [whenever-batch, within-minutes, live-under-seconds]
    optional: true
  - id: engine
    text: What does the heavy lifting?
    type: choice
    options: [ffmpeg-or-gstreamer, a-media-library, hardware-or-gpu-encoders, an-editor-plugin]
    optional: true
  - id: reference-clips
    text: Is there a set of awkward reference clips to test against (odd frame rates, variable frame rate, no audio, a corrupt file)?
    type: bool
    optional: true
rules:
  - criteria:
      - "A sample input produces the expected output — proof: the output file and a frame, listening or play-through check"
  - when: {role: [render-or-edit, encode-or-convert]}
    criteria:
      - "The same input and settings give the same output — proof: a comparison of two runs, such as by checksum or frame diff"
  - when: {role: [stream-or-play, publish]}
    criteria:
      - "Playback works in each target player or platform — proof: a checklist with one line per target"
  - when: {input: licensed}
    criteria:
      - "The licence for each source is recorded — proof: a list of sources and their terms"
    risk:
      level: medium
      reason: Using material outside its licence can lead to takedowns
  - when: {input: user-uploads}
    criteria:
      - "Uploads are size-limited and checked for type before processing — proof: a test with an oversized and a wrong-type file"
    risk:
      level: high
      reason: Untrusted files go through complex decoders and can abuse them
  - when: {size: hours-or-gigabytes}
    criteria:
      - "A long job can be resumed after a failure without starting over — proof: kill a run midway and resume it"
    risk:
      level: medium
      reason: Large jobs are slow and costly to repeat
  - when: {latency: live-under-seconds}
    criteria:
      - "Delay from input to viewer stays under the target through a 30-minute run, and a dropped input recovers without a restart — proof: timestamps or a latency log across the run"
    risk:
      level: high
      reason: Live media fails in public and in real time, and cannot be redone
  - when: {engine: hardware-or-gpu-encoders}
    criteria:
      - "When the hardware encoder is missing or busy the job falls back to software or fails with a clear message — proof: a run with hardware encoding turned off"
    risk:
      level: medium
      reason: Hardware encoders differ by driver, card and machine
  - when: {engine: an-editor-plugin}
    criteria:
      - "The plugin loads and renders in each supported host version — proof: a checklist with one line per host version"
  - when: {reference-clips: "false"}
    criteria:
      - "A reference set of awkward clips is fetched by a script and every clip runs through the system — proof: the clip list and a clean run over it"
    risk:
      level: medium
      reason: Media bugs hide in the files nobody tested
  - when: {pipeline: "true"}
    criteria:
      - "A failed job is reported, not silently skipped — proof: feed it a corrupt file and read the report"
