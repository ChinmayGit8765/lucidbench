# Lucidbench configuration.
#
# This file is yours: it lives in your user config directory and is never
# part of the repository. Every key is optional; the values below are the
# built-in defaults. Environment variables (LUCID_*) override this file.
#
# SECRETS: never put API keys or tokens in this file. Any secret setting takes
# a reference to an environment variable, written as env:NAME.

server:
  # Address the daemon (lucidd) listens on, as host:port. The default is
  # loopback only. ":7420" listens on every interface; the daemon can control
  # runner containers and re-run CI, so only do that on a network you trust.
  addr: "127.0.0.1:7420"

providers:
  # For each provider: enabled = false hides it from detection entirely.
  # extra_dirs = additional config directories to scan for accounts, for
  # example a second Claude profile.
  claude:
    enabled: true
    extra_dirs: []
  codex:
    enabled: true
    extra_dirs: []
  grok:
    enabled: true
    extra_dirs: []
  cursor:
    enabled: true
    extra_dirs: []

cluster:
  # Name of the local kind cluster (lowercase letters, digits, dashes).
  name: "lucidbench"

agent:
  # Container image used to run provider CLIs.
  image: "lucidbench/agent:dev"

vault:
  # Path to your notes vault. Empty means not configured.
  path: ""

ui:
  # dark, light or system.
  theme: "dark"

ci:
  # Runners & CI: self-hosted GitHub Actions runners and recent workflow runs.
  github:
    # Repositories to watch, as owner/name, for example ["you/your-repo"].
    repos: []
    # Token for the GitHub API, as an env:NAME reference. When that variable
    # is empty, Lucidbench asks the GitHub CLI (gh auth token) if installed.
    token: "env:GITHUB_TOKEN"
  runners:
    # Local runner containers: those in this docker compose project ...
    compose_project: ""
    # ... or whose image name contains this text. Empty disables a match.
    image_match: "github-runner"

docker:
  # Containers page: compose projects whose containers may be started,
  # stopped and restarted from the UI, besides the lucidbench project and the
  # runner containers above. Every other container is read-only.
  allowed_projects: []

power:
  # On-demand infrastructure. Each mode is one of:
  #   always     Lucidbench never stops it.
  #   on-demand  started when something needs it, stopped when idle.
  #   off        Lucidbench never starts or stops it on its own.
  # The Start and Stop buttons work in every mode.
  #
  # The kind cluster: on-demand starts it when a job is submitted or you
  # press Start, and stops it after this many minutes with no running pod,
  # no active job and no job submitted.
  cluster: "on-demand"
  cluster_idle_minutes: 15
  # The runner containers (ci.runners): on-demand starts a stopped runner
  # when its repository has a queued workflow run, and stops it after this
  # many minutes with no job on it and no queued or running run. A busy
  # runner is never stopped. on-demand asks GitHub every poll_seconds.
  runners: "always"
  runner_idle_minutes: 10
  # Compose projects to start and stop as a group from the UI, for example
  # [{project: "my-db", mode: "on-demand"}]. "Sleep everything idle" stops
  # the on-demand ones.
  stacks: []
  # How often the cluster and runners are checked, in seconds (10-3600).
  poll_seconds: 60

integrations:
  # Board connectors (Settings > Extensions). Each value names an environment
  # variable; never put a key here. Create a Linear key under Settings > Account
  # > Security & access; Trello keys are at trello.com/power-ups/admin.
  linear:
    token: "env:LINEAR_API_KEY"
  trello:
    key: "env:TRELLO_API_KEY"
    token: "env:TRELLO_TOKEN"
  # Payments (Stripe): a restricted or secret key. Test-mode keys can also
  # create products, prices, payment links and webhook endpoints from the
  # Payments page; live-mode keys are read-only.
  stripe:
    key: "env:STRIPE_API_KEY"
