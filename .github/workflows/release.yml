name: release

# Builds the Windows desktop installer.
# - Run it by hand (workflow_dispatch) to build only: the installer is kept as a
#   workflow artefact so it can be tested before anything is published.
# - Push a version tag (v1.2.3 or v1.2.3-beta.1) to also create a DRAFT GitHub
#   Release; publish the draft after testing the installer. The tag must match
#   the version in desktop/src-tauri/tauri.conf.json.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          app=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          tag="${GITHUB_REF_NAME#v}"
          echo "app=$app tag=$tag"
          test "$app" = "$tag"

      - name: Test
        run: go test ./...

      - name: Build installer
        working-directory: desktop
        run: |
          npm ci
          npm run build:sidecar
          npx tauri build

      - name: Collect artefacts
        run: |
          mkdir -p dist-release
          cp desktop/src-tauri/target/release/bundle/nsis/*-setup.exe dist-release/
          cp LICENSE THIRD_PARTY_NOTICES.md dist-release/
          cd dist-release && sha256sum *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: lucidbench-windows-installer
          path: dist-release/

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="## $version" '/^## / {p = ($0 == v || index($0, v " ") == 1)} p' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist-release/* $prerelease --draft \
            --title "Lucidbench $GITHUB_REF_NAME" --notes "${notes:-See CHANGELOG.md}"
