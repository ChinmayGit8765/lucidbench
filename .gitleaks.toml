# gitleaks configuration: extend the default rules, and allowlist the test file
# whose obviously fake key-shaped literals verify that secret values are rejected.
[extend]
useDefault = true

[allowlist]
description = "Fake key-shaped fixtures (sentinels) used by tests that prove secrets never leak"
paths = [
  '''internal/config/secret_test\.go''',
  '''internal/linear/linear_test\.go''',
  '''internal/trello/trello_test\.go''',
  '''internal/cloud/cloud_test\.go''',
]
