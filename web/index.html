<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Lucidbench</title>
    <script>
      // Replay the last applied theme before first paint so there is no
      // flash: its base, its variables and the density (see src/lib/theme.ts).
      // A ?theme= parameter is applied by the app once the themes load; here
      // only its base is known, for the built-in ids.
      ;(function () {
        var root = document.documentElement
        var forced = new URLSearchParams(location.search).get("theme")
        var saved = null
        try {
          saved = JSON.parse(localStorage.getItem("lucidbench.appearance") || "null")
        } catch (e) {}
        var bases = { dark: 1, midnight: 1, graphite: 1, aurora: 1, light: 0, daylight: 0, paper: 0 }
        var dark
        if (forced === "system") dark = matchMedia("(prefers-color-scheme: dark)").matches
        else if (forced && forced in bases) dark = !!bases[forced]
        else if (saved) dark = !!saved.dark
        else dark = true
        root.classList.toggle("dark", dark)
        if (saved && !forced) {
          for (var k in saved.vars || {}) root.style.setProperty(k, saved.vars[k])
          if (saved.density) root.dataset.density = saved.density
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
