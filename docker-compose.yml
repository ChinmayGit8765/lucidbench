services:
  lucidd:
    build: .
    image: lucidbench/lucidd:dev
    ports:
      # Published on loopback only; see docs/CONFIG.md, "Network exposure".
      - "127.0.0.1:7420:7420"
    environment:
      LUCID_ADDR: ":7420"
      LUCID_HOST_HOME: /host-home
      LUCID_IN_CONTAINER: "1"
      LUCID_CONFIG: /config/config.yaml
    # Root so the process can use the mounted docker socket.
    user: root
    volumes:
      # Host home, read-only, so lucidd can detect logged-in accounts (presence only).
      - ${USERPROFILE:-${HOME}}:/host-home:ro
      # Your Lucidbench config dir, read-only (see docs/CONFIG.md and .env.example).
      - ${LUCID_CONFIG_DIR:-${APPDATA:-${HOME}/.config}/lucidbench}:/config:ro
      # Lets the kind library find the cluster and list profile volumes. lucidd
      # joins the "kind" network itself once `lucid cluster up` has created it.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
